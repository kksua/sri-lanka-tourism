[project]
name = "sri-lanka-planner-backend"
version = "0.1.0"
description = "FastAPI and OpenAI Agents SDK backend for the Sri Lanka itinerary planner."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.59.0",
  "openai-agents>=0.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.8.0",
  "mypy>=1.13.0"
]

[tool.ruff]
line-length = 96
target-version = "py311"
exclude = [   
   ".venv",
    "build",
    "dist",
    "*.egg-info",]

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
